bio: |
  SZ4Grads Andes Sur es el grupo hermano de [SZ4Grads](https://www.sz4d.org/sz4grads), una red
  colaborativa, interdisciplinaria e intercultural de estudiantes de posgrado y recién egresados/as
  que estudian los procesos de las zonas de subducción.

  Somos jóvenes geocientistas de Latinoamérica interesados/as en estudiar la zona de subducción
  andina. Nos conectamos para intercambiar conocimiento, compartir recursos y dar visibilidad a
  nuestra investigación, en un ambiente de igualdad, respeto y colaboración.

  Trabajamos por una comunidad científica más inclusiva y por una comprensión más amplia de los
  peligros geológicos, con foco en la justicia social y la equidad en la mitigación del riesgo.

interests:
  - Zonas de subducción
  - Cordillera de los Andes
  - Volcanes
  - Peligros geológicos
  - Gestión y mitigación de riesgos
  - Ciencia y Sociedad

